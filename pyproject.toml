[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetladder"
version = "1.0.0"
description = "Nested, overlap-aware evidence plans for changing RAG budgets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BudgetLadder contributors"}]
keywords = ["rag", "retrieval", "context", "incremental-optimization", "provenance"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.urls]
Repository = "https://github.com/paopao-cc/budgetladder"

[project.scripts]
budgetladder = "budgetladder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budgetladder = ["py.typed"]
